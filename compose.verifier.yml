services:
  verifier:
    build: .
    environment:
      SERVICE: verifier
      SECRET_KEY: ${VERIFIER_SECRET:?Run scripts/init_deploy.py}
    volumes:
      - ./build/verifier:/data:ro
      - ./runtime/verifier-state:/state
    networks: [verifier]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  verifier-web:
    image: nginx:1.28.0-alpine
    ports: ["192.168.77.40:443:443"]
    volumes:
      - ./deploy/nginx/verifier.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/certs/verifier.crt:/certs/verifier.crt:ro
      - ./runtime/certs/verifier.key:/certs/verifier.key:ro
    depends_on: [verifier]
    networks: [verifier]
    restart: unless-stopped
networks:
  verifier: {internal: true}
