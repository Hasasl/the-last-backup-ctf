services:
  archive:
    image: nginx:1.28.0-alpine
    ports:
    - 192.168.77.20:8081:8081
    volumes:
    - ./build/stage1:/usr/share/nginx/html:ro
    - ./deploy/nginx/archive.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - archive
    restart: unless-stopped
  portal:
    build: .
    environment:
      SERVICE: portal
      SECRET_KEY: ${PORTAL_SECRET:?Run scripts/init_deploy.py}
    volumes:
    - ./build/portal:/data:ro
    - portal-state:/state
    networks:
    - portal
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      portal-init:
        condition: service_completed_successfully
  portal-web:
    image: nginx:1.28.0-alpine
    ports:
    - 192.168.77.20:8083:8083
    volumes:
    - ./deploy/nginx/portal.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - portal
    networks:
    - portal
    restart: unless-stopped
  portal-init:
    build: .
    user: 0:0
    command:
    - chown
    - 10001:10001
    - /state
    volumes:
    - portal-state:/state
    network_mode: none
    restart: 'no'
networks:
  archive:
    internal: true
  portal:
    internal: true
volumes:
  portal-state: null
