name: last-backup-full
services:
  ctfd:
    image: ctfd/ctfd:3.7.7
    environment:
      SECRET_KEY: ${CTFD_SECRET:?Run scripts/init_deploy.py}
      DATABASE_URL: mysql+pymysql://ctfd:${DB_PASSWORD}@database/ctfd
      REDIS_URL: redis://cache:6379
      UPLOAD_FOLDER: /var/uploads
      LOG_FOLDER: /var/log/CTFd
      REVERSE_PROXY: '0'
      WORKERS: '2'
      ADMIN_NAME: ${ADMIN_NAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
    - ctfd-uploads:/var/uploads
    - ctfd-logs:/var/log/CTFd
    - ./local/private:/bootstrap:ro
    - ./build/organizer:/organizer:ro
    - ./local/theme:/opt/CTFd/CTFd/themes/northstar:ro
    - ./local/plugins/northstar_replay:/opt/CTFd/CTFd/plugins/northstar_replay:ro
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    networks:
    - local-web
    - data
    restart: unless-stopped
    ports:
    - 127.0.0.1:8001:8000
  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/init_deploy.py}
      MARIADB_DATABASE: ctfd
      MARIADB_USER: ctfd
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/init_deploy.py}
    volumes:
    - ctfd-db:/var/lib/mysql
    networks:
    - data
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      retries: 12
    restart: unless-stopped
  cache:
    image: redis:7.4-alpine
    networks:
    - data
    restart: unless-stopped
  archive:
    image: nginx:1.28.0-alpine
    ports:
    - 127.0.0.1:8081:8081
    volumes:
    - ./build/stage1:/usr/share/nginx/html:ro
    - ./deploy/nginx/archive.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
    - local-archive
    restart: unless-stopped
  portal:
    build: .
    environment:
      SERVICE: portal
      SECRET_KEY: ${PORTAL_SECRET:?Run scripts/init_deploy.py}
    volumes:
    - ./build/portal:/data:ro
    - portal-state:/state
    networks:
    - local-portal
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    ports:
    - 127.0.0.1:8083:8000
    depends_on:
      portal-init:
        condition: service_completed_successfully
  linux:
    build: ./deploy/linux
    hostname: northstar-evidence
    ports:
    - 127.0.0.1:2222:22
    volumes:
    - ./build/organizer/linux-evidence.tar:/evidence.tar:ro
    - ./local/private/analyst_authorized_keys:/etc/ssh/authorized_keys/analyst:ro
    - ssh-hostkeys:/hostkeys
    - ./local/linux-entrypoint.sh:/local-entrypoint.sh:ro
    tmpfs:
    - /srv/northstar
    - /home/analyst/work:uid=2000,gid=2000,mode=0700
    - /run
    - /tmp
    read_only: true
    security_opt:
    - no-new-privileges:true
    networks:
    - local-evidence
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - /local-entrypoint.sh
  verifier:
    build: .
    environment:
      SERVICE: verifier
      SECRET_KEY: ${VERIFIER_SECRET:?Run scripts/init_deploy.py}
    volumes:
    - ./build/verifier:/data:ro
    - verifier-state:/state
    - ./local/local_wsgi.py:/app/local_wsgi.py:ro
    networks:
    - local-verifier
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    ports:
    - 127.0.0.1:8443:8000
    command:
    - gunicorn
    - --bind
    - 0.0.0.0:8000
    - --workers
    - '2'
    - --threads
    - '2'
    - --access-logfile
    - '-'
    - local_wsgi:app
    depends_on:
      verifier-init:
        condition: service_completed_successfully
  verifier-init:
    build: .
    image: last-backup-full-verifier
    user: 0:0
    command:
    - chown
    - 10001:10001
    - /state
    volumes:
    - verifier-state:/state
    network_mode: none
    restart: 'no'
  portal-init:
    image: last-backup-full-portal
    build: .
    user: 0:0
    command:
    - chown
    - 10001:10001
    - /state
    volumes:
    - portal-state:/state
    network_mode: none
    restart: 'no'
volumes:
  ctfd-db: null
  ctfd-uploads: null
  ctfd-logs: null
  ssh-hostkeys: null
  verifier-state: null
  portal-state: null
networks:
  data:
    internal: true
  local-web: {}
  local-archive: {}
  local-portal: {}
  local-evidence: {}
  local-verifier: {}
